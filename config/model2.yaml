model:
  target: models.models2.DBTFuse1
  params:
      num_features: 48
      out_channels: 1
      in_channels: 1
      patch_size: 16
  pretrained: 
train:
  accumulation_steps: 8
  epochs: 100
  optimizer:
    target: torch.optim.AdamW
    params:
      lr: 1.e-4

dataset:
  ratio: [0.8, 0.2]
  batch_size: 8
  shuffle: true
  url:
    CTMRI: /root/autodl-tmp/data/traindata/CTMRI
    SPECTMRI: /root/autodl-tmp/data/traindata/SPECTMRI
    PETMRI: /root/autodl-tmp/data/traindata/PETMRI
    
